<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HON Care · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#2a4b38;--gd:#102813;--gold:#cca65c;--goldT:#a8823a;--cream:#fefafb;--bg:#f4efe5;--line:#eadcc6;--ink:#1d2a22;--mute:#5d6a60}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.5 "Anuphan",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:20px;padding:14px 28px;background:var(--cream);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:26px;color:var(--g);letter-spacing:.01em}.logo b{color:var(--gold)}
.story{font-size:15px;color:var(--mute)}.story b{color:var(--ink)}
.sp{flex:1}
.seg{display:flex;background:#e6ede7;border-radius:12px;padding:4px;gap:4px}
.seg button,.lang{border:0;background:none;border-radius:9px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lang{border:1px solid var(--line);background:#fff;font-weight:600}
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 28px 0;counter-reset:s}
.flow button{position:relative;border:2px solid var(--line);background:var(--cream);border-radius:14px;padding:10px 12px 10px 52px;text-align:left;font:inherit;cursor:pointer;color:var(--ink);min-height:64px}
.flow button:before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:#e6ede7;color:var(--g);display:grid;place-items:center;font-weight:700}
.flow button b{display:block;font-size:15px}.flow button span{font-size:13px;color:var(--mute)}
.flow button[aria-current=step]{border-color:var(--g);background:#fff}.flow button[aria-current=step]:before{background:var(--g);color:#fff}
.flow button.sos[aria-current=step]{border-color:#c0322a}.flow button.sos[aria-current=step]:before{background:#c0322a}
.say{margin:10px 28px 0;padding:10px 16px;border-left:4px solid var(--gold);background:var(--cream);border-radius:0 12px 12px 0;font-size:16px;min-height:48px}
.say small{display:block;color:var(--goldT);font-weight:700;font-size:12px;letter-spacing:.04em}
.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;gap:48px;padding:14px 28px 18px;min-height:0}
.ph{display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .2s}
.ph h2{margin:0;font-size:16px;color:var(--g)}.ph h2 span{color:var(--mute);font-weight:400}
.ph.dim h2{color:var(--mute)}
.frame{width:calc(390px * var(--k));height:calc(820px * var(--k));border-radius:calc(40px * var(--k));background:var(--gd);padding:calc(10px * var(--k));box-shadow:0 18px 40px -18px rgba(16,40,19,.55);transition:box-shadow .2s}
.ph.on .frame{box-shadow:0 0 0 4px var(--gold),0 18px 40px -18px rgba(16,40,19,.55)}
.screen{width:370px;height:800px;border-radius:30px;overflow:hidden;transform:scale(var(--k));transform-origin:0 0;background:#fff}
.screen iframe{width:370px;height:800px;border:0;display:block}
.links{text-align:center;font-size:13px;color:var(--mute);padding:0 0 12px}.links a{color:var(--g)}
</style>
</head>
<body>
<header>
  <div class="logo">HON <b>Family</b></div>
  <div class="story" id="story"></div>
  <div class="sp"></div>
  <div class="seg" id="mode" role="group"></div>
  <button class="lang" id="lang"></button>
</header>
<nav class="flow" id="flow"></nav>
<div class="say" id="say"></div>
<main class="stage">
  <section class="ph" id="phE"><h2 id="hE"></h2><div class="frame"><div class="screen"><iframe id="fE"></iframe></div></div></section>
  <section class="ph" id="phF"><h2 id="hF"></h2><div class="frame"><div class="screen"><iframe id="fF"></iframe></div></div></section>
</main>
<div class="links" id="links"></div>
<script>
let lang=localStorage.getItem("hf-lang")==="en"?"en":"th";
const tx=(th,en)=>lang==="th"?th:en;
const S=[
 {t:()=>tx("ผู้สูงอายุวัด","Older adult measures"),d:()=>tx("30 วินาที ด้วยกล้องมือถือ","30 seconds with the phone camera"),p:"E",say:()=>tx("คุณประวิทย์ไม่ได้วัดมา 3 วัน วันนี้แค่วางนิ้วบนกล้องมือถือ 30 วินาที ไม่ต้องซื้อเครื่องเพิ่ม","Mr Prawit has not measured for 3 days. Today he rests a finger on the phone camera for 30 seconds. No extra device to buy."),go:()=>{}},
 {t:()=>tx("ผู้ดูแลเห็น","Caregiver sees it"),d:()=>tx("ค่าขึ้นที่มือถือผู้ดูแลทันที","The reading reaches the caregiver's phone"),p:"F",say:()=>tx("ผู้ดูแลที่อยู่ไกลเห็นค่าทันที ไม่ต้องโทรถาม ผู้ดูแลทุกคนเห็นข้อมูลชุดเดียวกัน","A caregiver far away sees the reading at once, no phone call needed. Every caregiver sees the same data."),go:()=>famTab(0,false)},
 {t:()=>tx("AI ช่วยคิด","AI helps"),d:()=>tx("ดูแนวโน้ม เตรียมงานให้","Reads the trend, prepares the work"),p:"F",say:()=>mode==="sum"?tx("AI สรุปให้ว่าวันนี้เรื่องไหนสำคัญ แนวโน้มเป็นอย่างไร และร่างข้อความไว้ให้ ผู้ดูแลเป็นคนตัดสินใจและกดส่งเอง","AI sums up what matters today and the trend, and drafts the messages. The caregiver decides and sends."):tx("HON Agent เห็นว่าไม่ได้วัด 3 วันและค่า AGI แย่ลง เตรียมงานให้: ชวนผู้สูงอายุวัด ร่างข้อความถึงหมอ สรุปให้ผู้ดูแลคนอื่น ทุกงานรอผู้ดูแลกดอนุมัติ","HON Agent sees 3 days without a reading and a worsening AGI, and prepares the work: ask the older adult to measure, draft a note to the doctor, update the other caregivers. Every task waits for the caregiver's approval."),go:()=>famTab(0,true)},
 {t:()=>tx("ส่งหมอ","To the doctor"),d:()=>tx("ร่างข้อความ + รายงาน PDF","Draft message + PDF report"),p:"F",say:()=>tx("AI ร่างข้อความถึงคุณหมอพร้อมรายงาน PDF ไม่วินิจฉัย ไม่ปรับยา หมอเป็นคนตัดสิน","AI drafts a note to the doctor with a PDF report. No diagnosis, no medicine changes: the doctor decides."),go:()=>famShow("[data-cp=doctor],[data-agok=doctor_msg]")},
 {t:()=>"SOS",d:()=>tx("เหตุฉุกเฉิน → 1669","Emergency → 1669"),p:"E",sos:1,say:()=>tx("ถ้าผู้สูงอายุล้มหรือกด SOS กฎความปลอดภัยทำงานทันที ไม่รอ AI ผู้ดูแลเห็นการ์ดแดง พิกัด และปุ่มโทร 1669","If the older adult falls or presses SOS, the safety rules act at once without waiting for AI. The caregiver sees a red card, the location and a button to call 1669."),go:()=>eldShow("#sosB")}
];
let mode=new URLSearchParams(location.search).get("mode")==="sum"?"sum":"agent",cur=0;
const $=s=>document.querySelector(s),fE=$("#fE"),fF=$("#fF");
const fit=()=>{const h=innerHeight-$("header").offsetHeight-$("#flow").offsetHeight-$("#say").offsetHeight-56,w=(innerWidth-160)/2;document.documentElement.style.setProperty("--k",Math.max(.45,Math.min(1.25,h/840,w/410)).toFixed(3))};
const doc=f=>{try{return f.contentDocument}catch(e){return null}};
const pickDad=()=>{const d=doc(fF),b=d&&d.querySelector('#who [data-ei="1"]');if(b&&b.getAttribute("aria-pressed")!=="true")b.click()};
function famTab(i,card){const d=doc(fF);if(!d)return;pickDad();const t=d.querySelector(`[data-tab="${i}"]`);if(t)t.click();if(card)setTimeout(()=>{const c=d.querySelector(".card.agent");if(c)c.scrollIntoView({behavior:"smooth",block:"start"})},150);else d.scrollingElement.scrollTo({top:0,behavior:"smooth"})}
function famShow(sel){famTab(0,false);setTimeout(()=>{const d=doc(fF);if(!d)return;let el=d.querySelector(sel);if(el&&!el.offsetParent){const f=d.querySelector('[data-view="full"]');if(f)f.click();el=d.querySelector(sel)}if(el)setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"center"}),100)},200)}
function eldShow(sel){const d=doc(fE);if(!d)return;const el=d.querySelector(sel);if(el)el.scrollIntoView({behavior:"smooth",block:"center"})}
const tidy=f=>{const d=doc(f);if(d&&!d.getElementById("demoCss")){const st=d.createElement("style");st.id="demoCss";st.textContent="html,main,*{scrollbar-width:none}*::-webkit-scrollbar{display:none}";d.head.appendChild(st)}};
const setLang=f=>{const d=doc(f),b=d&&d.querySelector("#lang");if(b&&(d.documentElement.lang||"th")!==lang)b.click()};
function loadE(){fE.src="app.html?role=eld";fE.onload=()=>{tidy(fE);setTimeout(()=>setLang(fE),200)}}
function loadF(){fF.src="app.html?role=fam&view=simple&mode="+mode;fF.onload=()=>setTimeout(()=>{tidy(fF);setLang(fF);pickDad();S[cur].go()},300)}
function chrome(){document.documentElement.lang=lang;
 $("#story").innerHTML=tx("เดโม: <b>ผู้สูงอายุ (คุณประวิทย์ 74 ปี) ไม่ได้วัดมา 3 วัน</b>","Demo: <b>an older adult (Mr Prawit, 74) has not measured for 3 days</b>");
 $("#mode").setAttribute("aria-label",tx("โหมด AI","AI mode"));
 $("#mode").innerHTML=[["agent",tx("Agent ทำให้","Agent acts")],["sum",tx("AI สรุป คุณทำเอง","AI summary, you act")]].map(m=>`<button data-mode="${m[0]}" aria-pressed="${mode===m[0]}">${m[1]}</button>`).join("");
 $("#lang").textContent=lang==="th"?"EN":"ไทย";
 $("#hE").innerHTML=tx("มือถือผู้สูงอายุ","Older adult's phone");
 $("#hF").innerHTML=tx("มือถือผู้ดูแล","Caregiver's phone");
 fE.title=tx("มือถือผู้สูงอายุ","Older adult's phone");fF.title=tx("มือถือผู้ดูแล","Caregiver's phone");
 $("#links").innerHTML=tx("เปิดแยก: ","Open alone: ")+`<a href="app.html?role=eld" target="_blank" rel="noopener">${tx("ฝั่งผู้สูงอายุ","Older adult")}</a> · <a href="app.html?role=fam" target="_blank" rel="noopener">${tx("ฝั่งผู้ดูแล","Caregiver")}</a>`}
function step(i,run=true){cur=i;const s=S[i];
 $("#flow").innerHTML=S.map((x,j)=>`<button data-i="${j}" class="${x.sos?"sos":""}" ${j===i?'aria-current="step"':""}><b>${x.t()}</b><span>${x.d()}</span></button>`).join("");
 $("#say").innerHTML=`<small>${tx(`ขั้นที่ ${i+1} · ดูที่${s.p==="E"?"มือถือผู้สูงอายุ":"มือถือผู้ดูแล"}`,`Step ${i+1} · watch the ${s.p==="E"?"older adult's":"caregiver's"} phone`)}</small>${s.say()}`;
 $("#phE").classList.toggle("on",s.p==="E");$("#phF").classList.toggle("on",s.p==="F");$("#phE").classList.toggle("dim",s.p!=="E");$("#phF").classList.toggle("dim",s.p!=="F");
 if(run)s.go();fit()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.i!==undefined){step(+b.dataset.i);return}
 if(b.id==="lang"){lang=lang==="th"?"en":"th";localStorage.setItem("hf-lang",lang);chrome();step(cur,false);setLang(fE);setLang(fF);return}
 if(b.dataset.mode&&b.dataset.mode!==mode){mode=b.dataset.mode;chrome();step(cur,false);loadF()}});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"&&cur<S.length-1)step(cur+1);if(e.key==="ArrowLeft"&&cur>0)step(cur-1)});
addEventListener("resize",fit);
chrome();loadE();loadF();step(0,false);
</script>
</body>
</html>
