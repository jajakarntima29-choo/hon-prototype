<title>HON Care</title>

<style>
/* VOICE: warm, calm, trustworthy — a nurse beside you, not a hospital system
   IDEA: the caregiver's side of HON: what Mom measures on her phone reaches the family
   PICTURE: the working app itself — today's card, vascular age, live alert with map
   COLOUR and TYPE: deep clinic teal, warm paper, coral accent; triage green/amber/red only for status. IBM Plex Sans Thai.
   LAYOUT: one phone-width column, sticky bottom tabs; on wide screens a centred device with a side note */
:root{color-scheme:light dark;
--bg:light-dark(#f6f1ea,#12191b);--paper:light-dark(#fffdf9,#1b2427);--ink:light-dark(#1d2a2e,#eef2f1);--mute:light-dark(#5d6b6f,#a3b1b4);
--line:light-dark(#e6ddd1,#2c393d);--teal:light-dark(#0f4c5c,#0d3a46);--tealT:light-dark(#0f4c5c,#8fd0de);--teal2:light-dark(#e3eef0,#173238);--coral:#e8664a;
--g:light-dark(#1f8a4c,#4cc47f);--gbg:light-dark(#e5f4e9,#16301f);--y:light-dark(#a36a00,#f2b544);--ybg:light-dark(#fdf1d8,#33290f);--r:light-dark(#c0322a,#ff7a70);--rbg:light-dark(#fbe6e3,#3a1a17);
--map:light-dark(#eae4da,#1e2a2d);--road:light-dark(#fffdf9,#33444a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{display:flex;justify-content:center;gap:40px;padding:24px 16px;align-items:flex-start}
.side{max-width:300px;padding-top:40px}.side h1{font-size:44px;line-height:1.05;margin:0 0 12px;color:var(--tealT)}.side p{color:var(--mute);margin:0 0 12px}
.app{width:100%;max-width:440px;background:var(--paper);border-radius:28px;box-shadow:0 20px 50px -20px rgba(15,76,92,.35);overflow:hidden;display:flex;flex-direction:column;min-height:min(880px,calc(100vh - 48px));position:relative}
@media(max-width:820px){.side{display:none}.wrap{padding:0}.app{border-radius:0;box-shadow:none;max-width:none;min-height:100vh}}
header.top{background:var(--teal);color:#fff;padding:16px 18px 18px}
.row{display:flex;align-items:center;gap:10px}
.brand{font-weight:700;font-size:20px;flex:1;line-height:1.3}.brand small{display:block;font-weight:400;font-size:13px;opacity:.8}
.hb{background:rgba(255,255,255,.15);border:0;border-radius:999px;padding:0 14px;min-height:42px;color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.hb svg{width:18px;height:18px}
.who{display:flex;gap:8px;margin-top:14px;overflow-x:auto}
.who button{flex:none;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.1);border:2px solid transparent;border-radius:16px;padding:6px 12px 6px 6px;color:#fff;text-align:left;min-height:56px}
.who button[aria-pressed=true]{background:rgba(255,255,255,.22);border-color:#fff}
.who b{display:block;font-size:15px;line-height:1.2}.who span{font-size:12px;opacity:.85}
.av{width:40px;height:40px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:#f3c9a8}
.av:before{content:"";position:absolute;left:11px;top:7px;width:18px;height:18px;border-radius:50%;background:#e8b08a}
.av:after{content:"";position:absolute;left:4px;top:26px;width:32px;height:24px;border-radius:50%;background:var(--c,#d97a5c)}
.sync{font-size:12px;opacity:.8;margin-top:10px}
main{flex:1;padding:18px 18px 100px;overflow-y:auto}
h2{font-size:22px;line-height:1.2;margin:4px 0 12px}h3{font-size:17px;margin:0 0 6px;line-height:1.35}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.alert{border:0}.alert.y{background:var(--ybg)}.alert.r{background:var(--rbg)}.alert.g{background:var(--gbg)}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;border-radius:999px;padding:3px 12px}
.tag.g{color:var(--g);background:var(--gbg)}.tag.y{color:var(--y);background:var(--ybg)}.tag.r{color:var(--r);background:var(--rbg)}
.dot{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block}
.btn{border:0;border-radius:14px;min-height:46px;padding:0 16px;font-weight:600;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.alt{background:var(--teal2);color:var(--ink)}.btn.red{background:var(--r);color:#fff}.btn.full{width:100%}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mini{font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--teal2);border-radius:14px;padding:12px}.stat b{font-size:24px;display:block;line-height:1.25;white-space:nowrap}.stat .mini{white-space:nowrap}
.va{display:flex;gap:16px;align-items:center}
.ring{width:112px;height:112px;flex:none;position:relative}.ring svg{width:100%;height:100%}
.ring div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:34px}.ring small{font-size:12px;color:var(--mute)}
.fig{position:relative;height:120px;margin-top:6px}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.list li:last-child{border:0}
.list .v{color:var(--mute);white-space:nowrap;text-align:right}
nav.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:2}
nav.tabs button{background:none;border:0;min-height:56px;border-radius:12px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
nav.tabs button[aria-selected=true]{color:var(--tealT);background:var(--teal2);font-weight:700}
nav.tabs svg{width:22px;height:22px}
.badge{position:absolute;top:6px;right:calc(50% - 20px);background:var(--r);color:#fff;font-size:11px;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;min-height:44px;padding:0 14px;font-size:15px}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}.msg.ai{align-self:flex-start;background:var(--teal2);border-bottom-left-radius:4px}
.composer{display:flex;gap:8px;position:sticky;bottom:76px;background:var(--paper);padding-top:8px}
.composer input{flex:1;border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:48px;font-size:16px;background:var(--bg)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:10px 0 10px 44px;position:relative;border-bottom:1px solid var(--line);cursor:pointer}
.steps li:before{content:counter(s);position:absolute;left:0;top:10px;width:32px;height:32px;border-radius:50%;background:var(--teal2);display:grid;place-items:center;font-weight:700}
.steps li.done{opacity:.55}.steps li.done:before{content:"✓";background:var(--gbg);color:var(--g)}
.glist button{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;min-height:64px}
.glist small{display:block;color:var(--mute);font-size:13px}
.back{background:none;border:0;color:var(--tealT);font-weight:600;min-height:44px;padding:0}
pre.sum{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:14px;font:14px/1.6 "IBM Plex Sans Thai",sans-serif;margin:0 0 12px}
.note{font-size:13px;color:var(--mute);border-left:3px solid var(--coral);padding-left:10px;margin:10px 0}
.timer{font-size:32px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.map{border-radius:16px;overflow:hidden;background:var(--map);position:relative}.map svg{display:block;width:100%;height:auto}
.lock{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);background:color-mix(in srgb,var(--paper) 45%,transparent)}
.esc{list-style:none;margin:10px 0 0;padding:0}
.esc li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:8px 0;align-items:start}
.esc i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:block;margin-top:2px}
.esc li.on i{background:var(--r);border-color:var(--r)}.esc li.ok i{background:var(--g);border-color:var(--g)}
.esc time{font-size:13px;color:var(--mute);white-space:nowrap}
.sw{position:relative;width:52px;height:30px;flex:none;border-radius:999px;border:0;background:var(--line)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked=true]{background:var(--g)}.sw[aria-checked=true]:after{left:25px}
.set{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.set:last-child{border:0}.set div{flex:1}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--teal2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;min-height:44px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--paper);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mute);font-weight:600}
td.c,th.c{text-align:center}
.toast{position:absolute;left:12px;right:12px;bottom:84px;z-index:5;background:var(--r);color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 12px 30px -8px rgba(0,0,0,.4);display:flex;gap:12px;align-items:center}
.toast b{display:block}.toast button{background:#fff;color:var(--r);border:0;border-radius:12px;min-height:44px;padding:0 14px;font-weight:700;flex:none}
.aibox{white-space:pre-wrap;background:var(--paper);border-radius:12px;padding:12px;margin:12px 0 8px;font-size:15px}.aibox:empty{display:none}
.ailab{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:700;color:var(--coral);letter-spacing:.02em}
.wf{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:0 0 14px;list-style:none;padding:0}
.wf li{background:var(--teal2);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;line-height:1.3;position:relative}
.wf li b{display:block;font-size:12px}.wf li.ok{background:var(--gbg);color:var(--g)}.wf li.ok b{color:var(--ink)}.wf li.ai:after{content:"AI";position:absolute;top:-7px;right:-2px;background:var(--coral);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:0 5px}
.wf span{display:block;font-size:11px;color:var(--mute)}
textarea.in{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:16px/1.5 inherit;font-family:inherit;background:var(--bg);color:var(--ink);resize:vertical;min-height:72px}
.ent{padding:10px 0;border-bottom:1px solid var(--line)}.ent:last-child{border:0}.ent p{margin:4px 0 0}
@media(prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}@keyframes f{from{opacity:0;transform:translateY(6px)}}.pulse{animation:p 1.4s ease-out infinite}@keyframes p{0%{r:8;opacity:.7}100%{r:26;opacity:0}}}
</style>
</head>
<body>

document.addEventListener("click",ev0=>{const b=ev0.target.closest("button,[data-st]");if(!b)return;const d=b.dataset;
 if(b.id==="lang"){lang=lang==="th"?"en":"th";try{localStorage.setItem("hc-lang",lang)}catch(x){}render(true);return}
 if(b.id==="sec"){showSec=true;addLog(["คุณมะลิ (ผู้ดูแลหลัก)","Mali (primary)"],["เปิดหน้าความปลอดภัย","Opened security settings"]);render();return}
 if(b.id==="secBack"){showSec=false;render();return}
 if(d.ei!==undefined){ei=+d.ei;sel.clear();render();return}
 if(d.tab!==undefined){tab=+d.tab;showSec=false;guide=tab===4?guide:null;render();return}
 if(d.guide){guide=d.guide;done=new Set();tab=4;showSec=false;clearInterval(timerI);render();return}
 if(b.id==="bk"){guide=null;clearInterval(timerI);render();return}
 if(d.st!==undefined){const i=+d.st;done.has(i)?done.delete(i):done.add(i);b.classList.toggle("done");return}
 if(d.s){sel.has(d.s)?sel.delete(d.s):sel.add(d.s);render(true);return}
 if(b.id==="clr"){sel.clear();render(true);return}
 if(b.id==="triMore"){triAi();return}
 if(d.q){aiAsk(d.q);return}
 if(d.sim){tab=1;showSec=false;startSim(d.sim);return}
 if(b.id==="goEv"){tab=1;showSec=false;if(ev)ei=ev.e;render();return}
 if(b.id==="ack"&&ev){ev.ack=true;addLog(["คุณมะลิ (ผู้ดูแลหลัก)","Mali (primary)"],["รับทราบเหตุฉุกเฉินและดูพิกัด","Acknowledged emergency, viewed location"]);render(true);return}
 if(b.id==="endEv"){ev=null;clearInterval(simI);addLog(["ระบบ HON","HON system"],["ปิดเหตุการณ์ — พิกัดจะปิดใน 60 นาที","Event closed — location locks in 60 min"]);render(true);return}
 if(d.rule){rules[d.rule]=!rules[d.rule];b.setAttribute("aria-checked",!!rules[d.rule]);return}
 if(d.loc){locMode=d.loc;addLog(["แม่สมศรี (เจ้าของข้อมูล)","Mom Somsri (data owner)"],[`ตั้งการแชร์ตำแหน่ง: ${d.loc==="emer"?"เฉพาะฉุกเฉิน":d.loc==="always"?"ตลอดเวลา":"ปิด"}`,`Location sharing set to ${d.loc}`]);render(true);return}
 if(d.linkEi!==undefined){linkEi=+d.linkEi;const v=$("#topicIn").value;render(true);$("#topicIn").value=v;return}
 if(b.id==="linkSave"){const v=$("#topicIn").value.trim().replace(/[^A-Za-z0-9_-]/g,"");if(v.length<12){$("#topicIn").focus();return}if(v!==topic){live=null;lss("hc-live","")}topic=v;lss("hc-topic",topic);lss("hc-link-ei",String(linkEi));linkEdit=false;ei=linkEi;startPoll();render();return}
 if(b.id==="linkEdit"){linkEdit=true;render(true);return}
 if(b.id==="nudge"){b.textContent=tx("ส่งแล้ว · ขึ้นแจ้งเตือนในมือถือพ่อ","Sent · notification on Dad's phone");b.disabled=true;return}
 if(b.id==="saveLog"){saveLog();return}
 if(b.id==="mkBrief"){mkBrief();return}
 if(b.id==="mic"&&dict){if(listening){dict.stop().catch(()=>{})}else{dict.start().catch(()=>{})}return}
 if(b.id==="mkSum"){sumDone[ei]=true;$("#sumBox").innerHTML=`<pre class="sum fade" id="sumTxt">${esc(summary())}</pre>`;b.textContent=tx("คัดลอก","Copy");b.id="cpSum";return}
 if(b.id==="cpSum"){navigator.clipboard.writeText($("#sumTxt").textContent).then(()=>b.textContent=tx("คัดลอกแล้ว","Copied")).catch(()=>{});return}
 if(b.id==="tStart"){clearInterval(timerI);let s=900;const tm=$("#tm");timerI=setInterval(()=>{s--;if(!document.body.contains(tm)||s<0){clearInterval(timerI);return}tm.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")},1000);b.disabled=true;return}});
document.addEventListener("keydown",k=>{if(k.key==="Enter"&&k.target.dataset&&k.target.dataset.st!==undefined){k.preventDefault();k.target.click()}});
document.addEventListener("submit",s=>{s.preventDefault();const q=$("#q").value.trim();if(q)aiAsk(q)});
render();
startPoll();
if(window.claude&&claude.use){claude.use("sample").then(s=>{sample=s}).catch(()=>{});
 claude.use("dictation").then(d=>{if(!d)return;dict=d;d.onFinal(({text})=>{const t=$("#logIn");if(t)t.value=(t.value?t.value+" ":"")+text});d.onState(({state})=>{listening=state==="listening";const m=$("#mic");if(m)m.textContent=listening?tx("หยุดฟัง","Stop"):tx("พูด","Speak")});if(tab===0&&!showSec)render(true)}).catch(()=>{})}
